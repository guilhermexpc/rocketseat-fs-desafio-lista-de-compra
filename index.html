<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Quicklist - Lista de compras</title>
    <link rel="stylesheet" href="styles/index.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="container">
      <div class="content">
        <img src="assets/img/logo.svg" id="logo" alt="Logomarca" />
        <nav>
          <img src="/assets/icons/backarrow.svg" alt="" />
          <a href="#">Voltar</a>
        </nav>
        <h1>Compras da semana</h1>
      </div>
    </header>

    <main class="container">
      <form class="main-form content">
        <fieldset id="list-new-item">
          <input type="text" id="list-name" class="input" placeholder="Adicione um novo item" />
          <button class="button" type="submit">
            <span>Adicionar item</span>
          </button>
        </fieldset>

        <fieldset id="list-items">
          <div class="card-list-item">
            <div class="item-checkbox">
              <input type="checkbox" id="input-item-1" name="list-item" />
              <label for="input-item-1">Pão de forma</label>
            </div>
            <button class="buton" type="submit" id="btn-item-1">
              <img src="assets/icons/trashicon.svg" alt="" />
            </button>
          </div>

          <div class="card-list-item">
            <div class="item-checkbox">
              <input type="checkbox" id="input-item-2" name="list-item" />
              <label for="input-item-2">Café preto</label>
            </div>
            <button class="buton" type="button" id="btn-item-2">
              <img src="assets/icons/trashicon.svg" alt="" />
            </button>
          </div>

          <div class="card-list-item">
            <div class="item-checkbox">
              <input type="checkbox" id="input-item-3" name="list-item" />
              <label for="input-item-3">Suco de laranja</label>
            </div>
            <button class="buton" type="button" id="btn-item-3">
              <img src="assets/icons/trashicon.svg" alt="" />
            </button>
          </div>

          <div class="card-list-item">
            <div class="item-checkbox">
              <input type="checkbox" id="input-item-4" name="list-item" />
              <label for="input-item-4">Bolacha</label>
            </div>
            <button class="" type="button" id="btn-item-4">
              <img src="assets/icons/trashicon.svg" alt="" />
            </button>
          </div>
        </fieldset>
        <div class="alertbox hidden">
          <div>
            <img src="assets/icons/warning-circle-filled.svg" alt="" />
            <span>O item foi removido da lista</span>
          </div>
          <button class="" type="button" id="btn-item-4">
            <img src="assets/icons/delete-small.svg" alt="" />
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
